<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра: Найди совпадение</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent: #38bdf8;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            color: var(--accent);
            text-align: center;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 12px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-gap: 12px;
            perspective: 1000px;
        }

        .card {
            width: 90px;
            height: 90px;
            background-color: var(--card-bg);
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            background-color: var(--card-hover);
        }

        .card.flipped {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 2.2rem;
            user-select: none;
        }

        .card-front {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .card-back {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            transform: rotateY(180deg);
        }

        /* Модальное окно результата */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid var(--accent);
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 400px) {
            .game-board {
                grid-template-columns: repeat(4, 70px);
                grid-gap: 8px;
            }
            .card {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>

    <h1>Найди совпадение</h1>
    
    <div class="stats">
        <div>Ходы: <span id="moves">0</span></div>
        <div>Время: <span id="timer">0</span>с</div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <!-- Модальное окно победы -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2>Победа! 🎉</h2>
            <p>Вы нашли все пары!</p>
            <p>Затрачено времени: <span id="finalTime">0</span> сек.</p>
            <p>Количество ходов: <span id="finalMoves">0</span></p>
            <button class="btn" onclick="startGame()">Играть снова</button>
        </div>
    </div>

    <script>
        const emojis = ['🐶', '🐱', '🦊', '🐼', '🐨', '🦁', '🐰', '🐯'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let isLocked = false;
        let gameStarted = false;

        // Генерация звуков без файлов с помощью AudioContext
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'flip') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'win') {
                // Победная мелодия
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.12);
                    g.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.12 + 0.2);
                    o.start(audioCtx.currentTime + index * 0.12);
                    o.stop(audioCtx.currentTime + index * 0.12 + 0.2);
                });
            }
        }

        function startGame() {
            // Сброс параметров
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            document.getElementById('winModal').style.display = 'none';
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            timer = 0;
            isLocked = false;
            gameStarted = false;
            document.getElementById('moves').textContent = moves;
            document.getElementById('timer').textContent = timer;
            clearInterval(timerInterval);

            // Создание пар карточек и перемешивание
            cards = [...emojis, ...emojis]
                .sort(() => Math.random() - 0.5)
                .map((emoji, index) => ({ id: index, emoji, isFlipped: false, isMatched: false }));

            // Рендер карточек на поле
            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('card');
                cardElement.dataset.id = card.id;

                cardElement.innerHTML = `
                    <div class="card-face card-front">❓</div>
                    <div class="card-face card-back">${card.emoji}</div>
                `;

                cardElement.addEventListener('click', () => flipCard(card.id, cardElement));
                board.appendChild(cardElement);
            });
        }

        function flipCard(id, element) {
            if (isLocked) return;
            const clickedCard = cards.find(c => c.id === id);

            if (clickedCard.isFlipped || clickedCard.isMatched) return;

            // Запуск таймера при первом клике
            if (!gameStarted) {
                gameStarted = true;
                timerInterval = setInterval(() => {
                    timer++;
                    document.getElementById('timer').textContent = timer;
                }, 1000);
            }

            playSound('flip');
            clickedCard.isFlipped = true;
            element.classList.add('flipped');
            flippedCards.push({ id, emoji: clickedCard.emoji, element });

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;

            if (card1.emoji === card2.emoji) {
                // Совпадение найдено
                cards.find(c => c.id === card1.id).isMatched = true;
                cards.find(c => c.id === card2.id).isMatched = true;
                flippedCards = [];
                matchedPairs++;
                playSound('match');

                // Проверка на конец игры
                if (matchedPairs === emojis.length) {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        playSound('win');
                        document.getElementById('finalTime').textContent = timer;
                        document.getElementById('finalMoves').textContent = moves;
                        document.getElementById('winModal').style.display = 'flex';
                    }, 500);
                }
            } else {
                // Нет совпадения, переворачиваем обратно
                isLocked = true;
                setTimeout(() => {
                    cards.find(c => c.id === card1.id).isFlipped = false;
                    cards.find(c => c.id === card2.id).isFlipped = false;
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                }, 800);
            }
        }

        // Первый запуск при загрузке страницы
        startGame();
    </script>
</body>
</html>
